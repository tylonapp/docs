<!--
  The Tylon mark: one trunk, three nodes on the ends of what leaves it — a card
  enters a stage and a branch exists.

  Light tile, for the dark theme.

  The tile stays rather than the strokes floating free. The artwork is one ink
  knocked out of a solid shape, and left transparent the thin strokes vanish
  into whatever is behind them — the same reason `apps/site/src/components/
  brand-icon.tsx` gives for using the tile.

  Redrawn geometry, from apps/site/public/favicon.svg. That file flips itself
  with `prefers-color-scheme`, which is right for a browser tab and wrong here:
  the docs theme is a button, not an operating system setting. So the ink is
  resolved per file, and these two are a pair — change one and the other is
  already wrong.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="9" fill="#FAFAFA"/>

  <clipPath id="baseline"><rect width="32" height="29.25"/></clipPath>

  <g clip-path="url(#baseline)" fill="none" stroke="#0A0A0A" stroke-width="2.05">
    <path d="M7.08 11.9 L12.9 18.73 C17.34 23.9 17.76 25.72 17.76 29.25 L17.76 30.25"/>
    <path d="M20.71 7.05 L12.9 18.73"/>
    <path d="M24.92 23.35 L19.37 30.02"/>
  </g>

  <g fill="#FAFAFA" stroke="#0A0A0A" stroke-width="2.05">
    <circle cx="7.08" cy="11.9" r="3.27"/>
    <circle cx="20.71" cy="7.05" r="3.27"/>
    <circle cx="24.92" cy="23.35" r="3.27"/>
  </g>
</svg>
