<!--
  The Tylon lockup: the mark and the wordmark, in the proportions the site's
  own header uses — a 24px tile, a 10px gap, and the word 20px tall, all
  centred on each other (see the header in apps/site/src/landing.tsx).

  Light tile and near-white word, for the dark theme.

  The mark is the favicon's geometry and the word is `brand-mark.tsx`'s paths,
  so the docs, the site and the application draw the same two things. Both are
  vector: one file, sharp at any size, and nothing to re-export when the header
  changes height.

  The ink is resolved here rather than inherited. `brand-mark.tsx` uses
  `currentColor` and the favicon uses `prefers-color-scheme`; neither works in
  a file loaded as an image against a theme somebody toggles. So this is a pair
  — change one and the other is already wrong.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118.63 24" role="img" aria-label="Tylon">
  <g transform="scale(0.75)">
    <rect width="32" height="32" rx="9" fill="#FAFAFA"/>

    <clipPath id="baseline"><rect width="32" height="29.25"/></clipPath>

    <g clip-path="url(#baseline)" fill="none" stroke="#0A0A0A" stroke-width="2.05">
    <path d="M7.08 11.9 L12.9 18.73 C17.34 23.9 17.76 25.72 17.76 29.25 L17.76 30.25"/>
    <path d="M20.71 7.05 L12.9 18.73"/>
    <path d="M24.92 23.35 L19.37 30.02"/>
    </g>

    <g fill="#FAFAFA" stroke="#0A0A0A" stroke-width="2.05">
    <circle cx="7.08" cy="11.9" r="3.27"/>
    <circle cx="20.71" cy="7.05" r="3.27"/>
    <circle cx="24.92" cy="23.35" r="3.27"/>
    </g>
  </g>

  <svg x="34" y="2.0" width="84.63" height="20" viewBox="99 116 402 95">
    <g transform="translate(0,327) scale(0.1,-0.1)" fill="#FAFAFA" stroke="none">
