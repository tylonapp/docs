<svg xmlns="http://www.w3.org/2000/svg" viewBox="99 116 402 95" role="img" aria-label="Tylon">
  <!--
    The Tylon wordmark. It says "Tylon", so nothing beside it needs to.

    Near-black, for the light theme — the same ink the app writes text in
    (oklch(0.145 0 0) in apps/web/src/index.css).

    The viewBox is the letters rather than the exported canvas: as drawn, the
    artwork sat in a box with a third of its height empty, which renders as a
    logo that came out wrong rather than one that is small.

    Kept in step with apps/web/src/components/brand-mark.tsx, which draws the
    same paths in `currentColor`. That trick cannot work in a standalone file
    loaded as an image, so the two themes are two files here — which is why
    this comment exists: change one and the other is already wrong.
  -->
