<!--
  The mark: one trunk, three nodes on the ends of what leaves it. It is the
  product's one sentence drawn — a card enters a stage and a branch exists.

  **Redrawn from the artwork, not traced.** What the drawing is made of was
  measured off it — three nodes of one size, the angle each stem leaves at, the
  curve the trunk settles into — and rebuilt here as three strokes and three
  circles. A tab is no place for a raster of a logo; geometry weighs nothing
  and stays sharp at every size a browser thinks to ask for.

  **The pen is a quarter heavier than the drawing's.** At 16 pixels the
  original's stroke lands under one of them: the nodes lose their holes and the
  mark turns to three grey smudges. Everything else — where the nodes sit, how
  big they are, where the stems point — is the drawing's.

  **Both stems stop on one line**, which is the artwork's own idea and worth
  keeping: trunk and lower branch are cut at the same height, as if the graph
  carried on below the tile. They are clipped rather than simply ended, because
  a cap is square to its own stroke and the lower stem arrives at an angle —
  left to end by itself it would be cut on the diagonal.

  **One ink, and it turns over with the tab it sits in.** A favicon has no text
  around it to inherit from, so `currentColor` is no use here and
  `prefers-color-scheme` does the same job: the tile takes the foreground and
  the branch is knocked out of it, and both swap when the tab strip does.

  The tile stays rather than going transparent. Thin strokes floating on a
  browser's own chrome disappear at 16 pixels; a solid shape does not, and
  which shape it is remains readable.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { --tile: #0a0a0a; --cut: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --tile: #fafafa; --cut: #0a0a0a; }
    }
  </style>

  <rect width="32" height="32" rx="9" fill="var(--tile)"/>

  <clipPath id="baseline"><rect width="32" height="29.25"/></clipPath>

  <g clip-path="url(#baseline)" fill="none" stroke="var(--cut)" stroke-width="2.05">
    <path d="M7.08 11.9 L12.9 18.73 C17.34 23.9 17.76 25.72 17.76 29.25 L17.76 30.25"/>
    <path d="M20.71 7.05 L12.9 18.73"/>
    <path d="M24.92 23.35 L19.37 30.02"/>
  </g>

  <g fill="var(--tile)" stroke="var(--cut)" stroke-width="2.05">
    <circle cx="7.08" cy="11.9" r="3.27"/>
    <circle cx="20.71" cy="7.05" r="3.27"/>
    <circle cx="24.92" cy="23.35" r="3.27"/>
  </g>
</svg>
